spring.application.name=campustourslive-core

# --- Datasource (PostgreSQL) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/campustours}
spring.datasource.username=${DB_USERNAME:ctl}
spring.datasource.password=${DB_PASSWORD:ctl}
# Send String bind params as PG "unknown" so they coerce into the snake_case enum
# types (account_status, user_role, …). Lets us map enums as @Enumerated(STRING)
# without Hibernate emitting a cast to a class-derived type name that doesn't exist.
spring.datasource.hikari.data-source-properties.stringtype=unspecified

# Throw (not silently 404-page) on unmapped routes so the handler returns a clean
# problem+json 404 instead of falling through to the generic 500 handler.
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# --- JPA: Flyway owns the schema; Hibernate never alters it ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Flyway (applies db/migration/V1__schema.sql, V2__seed_universities.sql) ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Auth (Google Sign-In / OIDC) ---
# Google's OIDC issuer; its JWKS validates every request's id_token (signature,
# issuer, expiry). Fetched once at startup.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER_URI:https://accounts.google.com}
# The Google OAuth Client ID. id_tokens must carry it in the "aud" claim — see
# AudienceValidator. Blank fails startup unless `ALLOW_INSECURE_AUDIENCE=true` (local dev only).
app.auth.audience=${GOOGLE_CLIENT_ID:}
# Explicit opt-out that lets the app boot with a BLANK audience (accepts any Google id_token).
# Local dev only — NEVER set in staging/prod. Default false → blank audience fails fast.
app.auth.allow-insecure-audience=${ALLOW_INSECURE_AUDIENCE:false}

# --- College Scorecard (live university/major directory for guide onboarding) ---
# Server-side API key only (never exposed to the browser). Free key at https://api.data.gov/signup/.
# Blank key → the /meta/universities and /meta/majors endpoints return an empty list.
app.scorecard.base-url=${SCORECARD_BASE_URL:https://api.data.gov/ed/collegescorecard/v1}
app.scorecard.api-key=${SCORECARD_API_KEY:}

# --- Campus images (Cloudflare R2 public bucket, keyed by university name) ---
campus.image.base-url=${CAMPUS_IMAGE_BASE_URL:https://pub-3225b84a9a0b4728b11f261ee52251ba.r2.dev/}

server.port=${CORE_PORT:8080}

# --- API docs (springdoc / OpenAPI 3) ---
# Auto-generated spec at /v3/api-docs; Swagger UI at /swagger-ui.html (both permitted
# unauthenticated in SecurityConfig for local/dev exploration). These are the springdoc
# defaults, stated explicitly for clarity.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# Don't auto-inject responses derived from @RestControllerAdvice (GlobalExceptionHandler) onto
# every operation. Each operation declares the error responses it actually returns — with an
# example — via @ApiResponse, which is what the Spectral response-has-example gate requires.
springdoc.override-with-generic-response=false
# Dev convenience: recompute the spec on every /v3/api-docs request instead of caching it per
# app context, so annotation edits surface right after a DevTools restart with no stale-cache
# risk. Negligible prod cost — Contract B's /v3/api-docs is not a hot path. If Spring profiles
# are introduced later, move this line to application-dev.properties.
springdoc.cache.disabled=true

# --- Actuator (health/info + Kubernetes liveness/readiness probes) ---
# /actuator/health, /actuator/health/liveness, /actuator/health/readiness are
# permitted unauthenticated in SecurityConfig; details only shown when authorized.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
