spring.application.name=campustourslive-core


# ============================================================
# Database - PostgreSQL
# ============================================================

# Database connection.
# Environment variables override the local development defaults.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/campustours}
spring.datasource.username=${DB_USERNAME:ctl}
spring.datasource.password=${DB_PASSWORD:ctl}

# Allow Java String values to be converted to PostgreSQL enum types
# such as account_status and user_role.
spring.datasource.hikari.data-source-properties.stringtype=unspecified


# ============================================================
# Web / MVC
# ============================================================

# Let our global exception handler handle unknown routes as JSON 404 errors.
spring.mvc.throw-exception-if-no-handler-found=true

# Disable Spring's default static-resource handling.
spring.web.resources.add-mappings=false


# ============================================================
# JPA / Hibernate
# ============================================================

# Flyway manages the database schema, so Hibernate must not create
# or modify database tables.
spring.jpa.hibernate.ddl-auto=none

# Database access should happen inside services/transactions,
# not later while a controller is building a response.
spring.jpa.open-in-view=false

# Store/read database timestamps consistently in UTC.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


# ============================================================
# Flyway - Database Migrations
# ============================================================

# Run database migration scripts when the application starts.
spring.flyway.enabled=true

# Migration files are located in:
# src/main/resources/db/migration
spring.flyway.locations=classpath:db/migration


# ============================================================
# Authentication - Google OIDC
# ============================================================

# Validate login tokens using Google's OIDC configuration and public keys.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER_URI:https://accounts.google.com}

# Google OAuth Client ID for this application.
# AudienceValidator checks that incoming tokens were issued for this app.
# GOOGLE_CLIENT_ID must be set for the normal backend to start.
app.auth.audience=${GOOGLE_CLIENT_ID:}


# ============================================================
# College Scorecard API
# ============================================================

# External API used to look up universities and majors.
app.scorecard.base-url=${SCORECARD_BASE_URL:https://api.data.gov/ed/collegescorecard/v1}

# API key used by the backend when calling College Scorecard.
# If empty, university/major lookup returns no results.
app.scorecard.api-key=${SCORECARD_API_KEY:}


# ============================================================
# College Scorecard Rate Limit
# ============================================================

# Allow at most 800 Scorecard API calls per hour per backend instance.
resilience4j.ratelimiter.instances.scorecard.limit-for-period=800
resilience4j.ratelimiter.instances.scorecard.limit-refresh-period=1h

# If the limit is reached, fail immediately instead of waiting.
resilience4j.ratelimiter.instances.scorecard.timeout-duration=0

# NOTE:
# This rate limit is per application instance.
# If multiple backend instances are deployed, their combined request
# count may exceed the Scorecard API's shared-key quota.


# ============================================================
# Campus Images
# ============================================================

# Public Cloudflare R2 location used for campus images.
campus.image.base-url=${CAMPUS_IMAGE_BASE_URL:https://pub-3225b84a9a0b4728b11f261ee52251ba.r2.dev/}


# ============================================================
# Server
# ============================================================

# HTTP port. Defaults to 8080 for local development.
server.port=${CORE_PORT:8080}


# ============================================================
# OpenAPI / Swagger
# ============================================================

# Generated OpenAPI JSON.
springdoc.api-docs.path=/v3/api-docs

# Interactive Swagger UI.
springdoc.swagger-ui.path=/swagger-ui.html

# Controllers explicitly document their own error responses.
springdoc.override-with-generic-response=false

# Regenerate the OpenAPI document on each request during development.
springdoc.cache.disabled=true


# ============================================================
# Actuator / Health Checks
# ============================================================

# Expose application health and information endpoints.
management.endpoints.web.exposure.include=health,info

# Enable liveness/readiness endpoints for container/Kubernetes health checks.
management.endpoint.health.probes.enabled=true

# Show detailed health information only to authorized users.
management.endpoint.health.show-details=when_authorized

